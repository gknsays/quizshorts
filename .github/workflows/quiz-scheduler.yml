name: Quiz Shorts (3x/gun)

# YAYIN SAATLERI (TRT), kanaldaki iki nis donusumlu:
#    07:00  quiz         <- BU DEPO
#    11:00  pratik bilgi (gknsays/shorts deposu)
#    14:00  quiz         <- BU DEPO
#    17:00  pratik bilgi (gknsays/shorts deposu)
#    19:30  quiz         <- BU DEPO
# Bu depo gunde 3 video atiyor, kanaldan toplam 5 video cikiyor.
#
#  YAYIN SAATI NASIL TUTTURULUYOR?
#  GitHub Actions'in cron'u dakikinde calismiyor: tetiklemeler saatlerce
#  gecikebiliyor, bir kismi da hic gelmiyor. Yayin saatini "isin calistigi
#  an"a baglarsan bu gecikmeyi yenmek mumkun degil - nitekim eski tasarimda
#  8 Eylul'de calistirmalar yesil gorundugu halde tek video cikmadi.
#
#  Bu yuzden yayin saati tetiklemeden AYRILDI:
#    1) Video hedef saatten 8 saate kadar ONCE uretiliyor.
#    2) YouTube'a "private + publishAt" ile yukleniyor.
#    3) Videoyu yayina alma isini YouTube yapiyor - dakikasi dakikasina.
#  Yani is gece 02:00'de de calissa 06:40'ta da calissa, video TRT 07:00'de
#  yayina giriyor.
#
#  8 saatlik hazirlik penceresi ozellikle 07:00 yayini icin secildi: uretim
#  bir onceki aksam TRT 23:00'te aciliyor, yani sabahki video gece boyunca
#  hazirlanabiliyor. Bekci bu yuzden gun sinirini asabiliyor.
#
#  NEDEN AZ SAYIDA VIDEO? Ayni kanaldan gun icinde cok sayida video
#  ciktiginda YouTube her birine daha kucuk bir baslangic gosterim havuzu
#  ayirir ve videolar birbirinin izleyicisini yer.

on:
  schedule:
    # Saat basi yoklaniyor. Uretim penceresi 07:00 yayini icin bir onceki
    # aksam TRT 23:00'te (UTC 20:00) aciliyor ve 19:30 yayininin telafisi
    # TRT 22:30'a (UTC 19:30) kadar suruyor - yani pencere gunun tamamina
    # yayiliyor, bu yuzden butun saatlerde yokluyoruz.
    # Tetiklemeler duzensiz geldigi icin ne kadar cok deneme olursa hedef
    # saatten once uretim yapma sansi o kadar yuksek. Bosa gecen yoklamalar
    # bekcide ~10 saniyede sonlandigi icin maliyeti yok.
    # Dakika 07: tam saat baslari GitHub tarafinda en yogun an, oradan kaciyoruz.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Slot bekcisini atla ve hemen video uret"
        type: boolean
        default: true

permissions:
  contents: write # data/used-quiz.json ve slots.json'u geri commit'leyebilmek icin

# Iki calistirma ayni anda baslarsa ikisi de ayni soru gecmisini okur, benzer
# sorular uretir ve dosyayi geri push ederken cakisirlar. Siraya aliniyor.
concurrency:
  group: quiz-shorts
  cancel-in-progress: false

jobs:
  quiz-uret-ve-yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Bekci: bu tetiklemede gercekten video uretilecek mi?
      # Cogu tetikleme burada durur ve is ~10 saniyede biter.
      - name: Yayin kontrolu
        id: guard
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Elle zorlanan calistirma - bekci atlaniyor."
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "slot=manual" >> $GITHUB_OUTPUT
          else
            node scripts/slotGuard.mjs check
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: 20

      # Remotion render icin Chromium bagimliliklari. Bu hat stok video
      # kullanmiyor ama render yine tarayici uzerinden yapiliyor.
      - name: Sistem bagimliliklari (Remotion/Chromium icin)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -e
          sudo apt-get update

          PKGS="ffmpeg libnss3 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 \
                libxfixes3 libgbm1 libpangocairo-1.0-0 libcairo2 libgtk-3-0"

          # Ubuntu 24.04'teki "t64" gecisinde bu paketler yeniden adlandirildi
          # (libasound2 -> libasound2t64 gibi). Hangi ad mevcutsa onu kuruyoruz;
          # boylece runner imaji ileride degisse de bu adim kirilmiyor.
          for base in libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2; do
            if apt-cache show "${base}t64" > /dev/null 2>&1; then
              PKGS="$PKGS ${base}t64"
            else
              PKGS="$PKGS ${base}"
            fi
          done

          echo "Kurulacak paketler: $PKGS"
          sudo apt-get install -y --no-install-recommends $PKGS

      - name: Bagimliliklari kur
        if: steps.guard.outputs.should_run == 'true'
        run: npm ci

      - name: token.json olustur (kayitli secret'tan)
        if: steps.guard.outputs.should_run == 'true'
        run: echo '${{ secrets.YT_TOKEN_JSON }}' > token.json

      - name: Quiz uret ve yukle
        if: steps.guard.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          EDGE_TTS_VOICE: ${{ secrets.EDGE_TTS_VOICE }}
          EDGE_TTS_RATE: ${{ secrets.EDGE_TTS_RATE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REDIRECT_URI: ${{ secrets.YT_REDIRECT_URI }}
          YT_PRIVACY_STATUS: ${{ secrets.YT_PRIVACY_STATUS }}
          # Videonun YouTube'da yayina girecegi tam an (RFC3339, UTC).
          # scripts/slotGuard.mjs hesapliyor, scripts/upload.mjs uyguluyor.
          # Bos ise video dogrudan yayinlanir (gecikmis yayin telafisi).
          PUBLISH_AT: ${{ steps.guard.outputs.publish_at }}
          # Kapanis ekraninda gosterilen kanal adi.
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Fokus' }}
        run: node scripts/produceQuiz.mjs

      - name: Uretilen videoyu artifact olarak sakla (yedek/kontrol amacli)
        if: always() && steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video-${{ github.run_id }}
          path: out/quiz.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Yayini isle ve soru gecmisini geri kaydet
        if: success() && steps.guard.outputs.should_run == 'true'
        env:
          SLOT: ${{ steps.guard.outputs.slot }}
        run: |
          node scripts/slotGuard.mjs done
          git config user.name "quiz-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          # Dosyalari tek tek degil klasor olarak ekliyoruz: slots.json ilk
          # calistirmada henuz olusmamis olabiliyor ve eksik dosyayi 'git add'
          # etmek adimi hataya dusuruyor (video yuklenmis olsa bile is basarisiz
          # gorunuyordu). Uretim ciktilari zaten .gitignore'da.
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: soru gecmisini guncelle [skip ci]"
            git pull --rebase origin HEAD
            git push
          else
            echo "Soru gecmisinde degisiklik yok, commit atlaniyor."
          fi
