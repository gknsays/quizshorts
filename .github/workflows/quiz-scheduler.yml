name: Quiz Shorts (4x/gun)

# ZAMANLAMA NEDEN BOYLE KURULDU?
# GitHub Actions'in zamanlanmis isleri garanti degil; kendi belgelerinde
# "yogunluk donemlerinde gecikebilir veya calismayabilir" yaziyor.
#
# Bu yuzden tek bir cron'a guvenmiyoruz: cron her 20 dakikada bir YOKLUYOR,
# asil karari scripts/slotGuard.mjs veriyor. Bekci, gecmis slotlardan
# yayinlanmamis olan var mi diye bakar; yoksa is ~20 saniyede sonlanir,
# varsa pipeline calisir ve slot data/slots.json'a islenir. Boylece GitHub
# tetiklemelerin cogunu dusurse bile slottan sonraki ilk basarili yoklamada
# video cikar, ve ayni slot icin ikinci kez cikmaz.
#
# Yayin slotlari (scripts/slotGuard.mjs icinde tanimli):
#   TRT 10:12 = UTC 07:12   (sabah kusagi)
#   TRT 15:12 = UTC 12:12   (ikindi)
#   TRT 20:12 = UTC 17:12   (aksam zirvesi)
#
# Ayni kanalda ikinci bir otomasyon calisiyor (gknsays/shorts) ve onun
# slotlari bunlarin ARASINDA: TRT 12:12 / 17:12 / 22:12. Kanaldan gun
# boyunca 6 video cikiyor, iki video arasinda en az 2 saat var.
#
# NEDEN AZ SAYIDA VIDEO? Ayni kanaldan gun icinde cok sayida video ciktiginda YouTube her
# birine daha kucuk bir baslangic gosterim havuzu ayirir ve videolar
# birbirinin izleyicisini yer. Kanal oturmamisken dogru strateji, gosterimi
# az sayida videoda yogunlastirip izlenme oranini yukari cekmektir.

on:
  schedule:
    # Pencere ilk slotu (07:12 UTC) ve son slotun (17:12 UTC) 3 saatlik
    # telafi suresini kapsiyor.
    - cron: "*/20 7-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Slot bekcisini atla ve hemen video uret"
        type: boolean
        default: true

permissions:
  contents: write # data/used-quiz.json ve slots.json'u geri commit'leyebilmek icin

# Iki calistirma ayni anda baslarsa ikisi de ayni soru gecmisini okur, benzer
# sorular uretir ve dosyayi geri push ederken cakisirlar. Siraya aliniyor.
concurrency:
  group: quiz-shorts
  cancel-in-progress: false

jobs:
  quiz-uret-ve-yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Bekci: bu tetiklemede gercekten video uretilecek mi?
      # Cogu tetikleme burada durur ve is saniyeler icinde biter.
      - name: Yayin slotu kontrolu
        id: guard
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Elle zorlanan calistirma - bekci atlaniyor."
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "slot=manual" >> $GITHUB_OUTPUT
          else
            node scripts/slotGuard.mjs check
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: 20

      # Remotion render icin Chromium bagimliliklari. Bu hat stok video
      # kullanmiyor ama render yine tarayici uzerinden yapiliyor.
      - name: Sistem bagimliliklari (Remotion/Chromium icin)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -e
          sudo apt-get update

          PKGS="ffmpeg libnss3 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 \
                libxfixes3 libgbm1 libpangocairo-1.0-0 libcairo2 libgtk-3-0"

          # Ubuntu 24.04'teki "t64" gecisinde bu paketler yeniden adlandirildi
          # (libasound2 -> libasound2t64 gibi). Hangi ad mevcutsa onu kuruyoruz;
          # boylece runner imaji ileride degisse de bu adim kirilmiyor.
          for base in libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2; do
            if apt-cache show "${base}t64" > /dev/null 2>&1; then
              PKGS="$PKGS ${base}t64"
            else
              PKGS="$PKGS ${base}"
            fi
          done

          echo "Kurulacak paketler: $PKGS"
          sudo apt-get install -y --no-install-recommends $PKGS

      - name: Bagimliliklari kur
        if: steps.guard.outputs.should_run == 'true'
        run: npm ci

      - name: token.json olustur (kayitli secret'tan)
        if: steps.guard.outputs.should_run == 'true'
        run: echo '${{ secrets.YT_TOKEN_JSON }}' > token.json

      - name: Quiz uret ve yukle
        if: steps.guard.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          EDGE_TTS_VOICE: ${{ secrets.EDGE_TTS_VOICE }}
          EDGE_TTS_RATE: ${{ secrets.EDGE_TTS_RATE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REDIRECT_URI: ${{ secrets.YT_REDIRECT_URI }}
          YT_PRIVACY_STATUS: ${{ secrets.YT_PRIVACY_STATUS }}
          # Kapanis ekraninda gosterilen kanal adi.
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Fokus' }}
        run: node scripts/produceQuiz.mjs

      - name: Uretilen videoyu artifact olarak sakla (yedek/kontrol amacli)
        if: always() && steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video-${{ github.run_id }}
          path: out/quiz.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Slotu isaretle ve soru gecmisini geri kaydet
        if: success() && steps.guard.outputs.should_run == 'true'
        env:
          SLOT: ${{ steps.guard.outputs.slot }}
        run: |
          node scripts/slotGuard.mjs done
          git config user.name "quiz-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          # Dosyalari tek tek degil klasor olarak ekliyoruz: slots.json ilk
          # calistirmada henuz olusmamis olabiliyor ve eksik dosyayi 'git add'
          # etmek adimi hataya dusuruyor (video yuklenmis olsa bile is basarisiz
          # gorunuyordu). Uretim ciktilari zaten .gitignore'da.
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: soru gecmisini guncelle [skip ci]"
            git pull --rebase origin HEAD
            git push
          else
            echo "Soru gecmisinde degisiklik yok, commit atlaniyor."
          fi
